function rank(lv){if(lv>=250)return"SSS";if(lv>=200)return"SS";if(lv>=140)return"S";if(lv>=100)return"A";if(lv>=60)return"B";return"—"}
function next(lv){if(lv>=250)return{to:250,label:"已達 SSS",pct:100};if(lv>=200)return{to:250,label:"→ SSS 250",pct:(lv-200)/50*100};if(lv>=140)return{to:200,label:"→ SS 200",pct:(lv-140)/60*100};if(lv>=100)return{to:140,label:"→ S 140",pct:(lv-100)/40*100};if(lv>=60)return{to:100,label:"→ A 100",pct:(lv-60)/40*100};return{to:60,label:"→ B 60",pct:lv/60*100}}function legionBonus(j){const lv=Number(j.level)||0;if(lv>=250)return j.tiers[4];if(lv>=200)return j.tiers[3];if(lv>=140)return j.tiers[2];if(lv>=100)return j.tiers[1];if(lv>=60)return j.tiers[0];return "Lv.60 解鎖："+j.tiers[0]}function totalProgress(lv){lv=Number(lv)||0;if(lv<60)return{pct:Math.max(0,Math.min(100,lv/60*100)),label:"→ B 60",remain:60-lv};return{pct:Math.max(0,Math.min(100,(lv-60)/190*100)),label:"B → SSS 250",remain:Math.max(0,250-lv)}}
function setLevel(i,lv){jobs[i].level=Math.max(0,Math.min(300,Number(lv)||0));save();render();toast("已更新 "+jobs[i].name+" 到 Lv."+jobs[i].level+" 🌸")}
function rows(){const f=filter.value,s=sort.value;let r=jobs.map((j,i)=>({...j,i}));if(f==="started")r=r.filter(j=>j.level>0);if(f==="notStarted")r=r.filter(j=>j.level===0);if(f==="ss")r=r.filter(j=>j.level>=200);if(f==="new")r=r.filter(j=>j.new);if(s==="levelDesc")r.sort((a,b)=>b.level-a.level||a.category.localeCompare(b.category,"zh-Hant"));if(s==="category")r.sort((a,b)=>a.category.localeCompare(b.category,"zh-Hant")||b.level-a.level);if(s==="progress")r.sort((a,b)=>next(b.level).pct-next(a.level).pct);if(s==="name")r.sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));return r}

function imageBlock(j){return '<div class="photo" data-fallback="'+fallbackIcon(j.category)+'"><img loading="lazy" src="'+esc(j.photo)+'" alt="'+esc(j.name)+'"></div>'}
function attachImageFallbacks(){document.querySelectorAll(".photo img").forEach(img=>{img.addEventListener("error",()=>{const p=img.parentElement;p.innerHTML='<span class="emoji">'+p.dataset.fallback+"</span>"},{once:true})})}
function renderStats(){const total=jobs.reduce((a,j)=>a+j.level,0),started=jobs.filter(j=>j.level>0).length,unique=new Set(jobs.filter(j=>j.level>0).map(j=>j.name.replace(/ #\\d/,""))).size,ss=jobs.filter(j=>j.level>=200).length;totalLevel.textContent=total.toLocaleString();startedCount.textContent=started;ssCount.textContent=ss;progressCount.textContent=unique+"/"+jobs.length}
function renderProgress(){grid.innerHTML=rows().map(j=>{const n=next(j.level),tp=totalProgress(j.level),pct=Math.max(0,Math.min(100,tp.pct)),r=rank(j.level);return '<article class="card border-glow-card" data-cat="'+esc(j.category)+'"><span class="edge-light"></span><div class="cardHead">'+imageBlock(j)+'<div><div class="name">'+esc(j.name)+'</div><div class="eng">'+esc(j.english)+'</div><div class="badges"><span class="badge">'+esc(j.category)+'</span><span class="badge '+(r==="SS"?"ss":r==="SSS"?"sss":"")+'">'+r+' 卡</span>'+(j.new?'<span class="badge new">🆕 新職業</span>':'')+'</div></div></div><div class="levelBox"><div><span class="label">目前狀態</span><div class="level">'+(j.level>0?"✅ Lv."+j.level:(j.new?"🆕 未開始":"未開始"))+'</div></div><div class="btns"><button class="small add" data-i="'+j.i+'" data-n="1">+1</button><button class="small add" data-i="'+j.i+'" data-n="5">+5</button><button class="small add" data-i="'+j.i+'" data-n="10">+10</button><input class="lvInput" type="number" value="'+j.level+'" min="0" max="300" data-i="'+j.i+'"></div></div><div class="progressText"><span>'+Math.round(pct)+"% "+tp.label+'</span><span>'+(j.level>=250?"完成！":"還差 "+tp.remain+" 等")+'</span></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="stageMarks"><span>B</span><span>A</span><span>S</span><span>SS</span><span>SSS</span></div><div class="info"><div><span class="label">傳授</span><span class="value">'+esc(j.link)+'</span></div><div><span class="label">戰地</span><span class="value">'+esc(legionBonus(j))+'</span></div></div><div class="note">🍁 '+esc(j.note)+'</div></article>'}).join("");document.querySelectorAll(".add").forEach(b=>b.onclick=()=>setLevel(+b.dataset.i,jobs[+b.dataset.i].level+ +b.dataset.n));document.querySelectorAll(".lvInput").forEach(inp=>inp.onchange=()=>setLevel(+inp.dataset.i,inp.value));attachImageFallbacks()}
function renderRef(){let r=referenceJobs.slice();if(refCat!=="全部")r=r.filter(j=>j.category===refCat);refList.innerHTML=r.map(j=>'<article class="linkCard border-glow-card" data-cat="'+esc(j.category)+'"><span class="edge-light"></span>'+imageBlock(j)+'<div><div class="name">'+esc(j.name)+' <span class="eng">'+esc(j.english)+'</span></div><div class="badges"><span class="badge">'+esc(j.category)+'</span><span class="badge">戰地：'+esc(j.legion)+'</span>'+(j.new?'<span class="badge new">🆕 新職業</span>':'')+'</div><div class="skillBox"><div class="linkIcon">🔗</div><div><div class="skillName">'+esc(j.linkName)+'｜'+esc(j.link)+'</div><div class="skillDesc">'+esc(j.linkDetail)+' '+esc(j.extra)+'</div></div></div><div class="tierTable"><div class="tierCell"><b>B</b><span>Lv.60<br>'+esc(j.tiers[0])+'</span></div><div class="tierCell"><b>A</b><span>Lv.100<br>'+esc(j.tiers[1])+'</span></div><div class="tierCell"><b>S</b><span>Lv.140<br>'+esc(j.tiers[2])+'</span></div><div class="tierCell"><b>SS</b><span>Lv.200<br>'+esc(j.tiers[3])+'</span></div><div class="tierCell"><b>SSS</b><span>Lv.250<br>'+esc(j.tiers[4])+'</span></div></div></div></article>').join("");attachImageFallbacks()}
function render(){renderStats();if(view==="progress")renderProgress();else renderRef();bindBorderGlow()}
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{view=btn.dataset.view;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===view));progressView.classList.toggle("hidden",view!=="progress");linksView.classList.toggle("hidden",view!=="links");render()});document.querySelectorAll(".catBtn").forEach(btn=>btn.onclick=()=>{refCat=btn.dataset.cat;document.querySelectorAll(".catBtn").forEach(b=>b.classList.toggle("active",b.dataset.cat===refCat));renderRef();bindBorderGlow()});filter.onchange=render;sort.onchange=render;
copyBtn.onclick=()=>{const top=[...jobs].sort((a,b)=>b.level-a.level).slice(0,12);const text=["🌸 楓之谷N 戰地進度表 🌸","","目前戰地總等級："+jobs.reduce((a,j)=>a+j.level,0),"已建立角色："+jobs.filter(j=>j.level>0).length+" 隻","SS 以上："+jobs.filter(j=>j.level>=200).length+" 隻","","【目前角色排行】",...top.map(j=>(j.level>0?"✅":"🤍")+" "+j.name+"｜Lv."+j.level+"｜"+rank(j.level)+"｜"+Math.round(next(j.level).pct)+"% "+next(j.level).label)].join("\\n");navigator.clipboard.writeText(text).then(()=>toast("已複製 DC 摘要"))}
exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify(jobs.map(({photo,tiers,...j})=>j),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="maplestory-n-tracker-backup.json";a.click();toast("已匯出備份")}
importBtn.onclick=()=>{const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(Array.isArray(imported)){const map=new Map(imported.map(j=>[j.name+"|"+j.english,j]));jobs=initialJobs.map(j=>({...j,...(map.get(j.name+"|"+j.english)||{}),photo:j.photo,tiers:j.tiers}));save();render();toast("匯入完成")}else alert("匯入檔案格式不對")}catch(e){alert("匯入失敗")}};r.readAsText(f)};input.click()}
resetBtn.onclick=()=>{if(confirm("確定要還原嗎？等級會回到初始狀態。")){localStorage.removeItem("maplestoryNTracker_v91_levels");jobs=structuredClone(initialJobs);save();render();toast("已還原")}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove("show"),1600)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function getCenterOfElement(el){const{width,height}=el.getBoundingClientRect();return[width/2,height/2]}
function getEdgeProximity(el,x,y){const[cx,cy]=getCenterOfElement(el),dx=x-cx,dy=y-cy;let kx=Infinity,ky=Infinity;if(dx!==0)kx=cx/Math.abs(dx);if(dy!==0)ky=cy/Math.abs(dy);return Math.min(Math.max(1/Math.min(kx,ky),0),1)}
function getCursorAngle(el,x,y){const[cx,cy]=getCenterOfElement(el),dx=x-cx,dy=y-cy;if(dx===0&&dy===0)return 0;let degrees=Math.atan2(dy,dx)*(180/Math.PI)+90;if(degrees<0)degrees+=360;return degrees}
function bindBorderGlow(){document.querySelectorAll(".border-glow-card").forEach(card=>{if(card.dataset.glowBound)return;card.dataset.glowBound="1";card.addEventListener("pointermove",e=>{const rect=card.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,edge=getEdgeProximity(card,x,y),angle=getCursorAngle(card,x,y);card.style.setProperty("--edge-proximity",`${(edge*100).toFixed(3)}`);card.style.setProperty("--cursor-angle",`${angle.toFixed(3)}deg`)});card.addEventListener("pointerleave",()=>card.style.setProperty("--edge-proximity","0"))})}
// init handled above
</script></body></html>
